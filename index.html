<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>What's Your Price?</title><style>body{background:#141225;color:#fff;font:18px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:28px}h1{font-size:clamp(36px,6vw,72px);margin:10px 0;color:#c4a5ff}h2{font-size:32px}button,input{font:inherit;padding:14px;border-radius:12px;border:0;margin:6px}button{background:#a78bfa;color:#17112c;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input{max-width:90%}input[type=range]{width:90%}.panel{background:#25213b;padding:24px;border-radius:20px;margin:16px 0}.big{font-size:56px;color:#72e9ad;font-weight:bold}.grid{display:flex;flex-wrap:wrap;gap:15px}.grid>div{flex:1;min-width:140px}.bar{background:#a78bfa;height:18px;border-radius:5px;min-width:1px}small{color:#c6bfdc}a{color:#c4a5ff}img{background:white;padding:12px;border-radius:12px} </style><main><small>LIVE MARKET LAB • DYNAMIC PRICING</small><h1>What's Your Price?</h1><div id="app">Connecting…</div></main><script type=module>
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,set,get,onValue,update} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {config} from './config.js';
const app=document.querySelector('#app'), scenarios=[['An ordinary day','It is 5 PM. The weather is nice, drivers are plentiful and transit is running.'],['The rainstorm','It is pouring rain. Everyone wants a ride and drivers are limited.'],['Desperate to get home','It is 2 AM after a concert. Transit has stopped and your phone is at 5%.']], poll=['Yes, smart business strategy','No, it takes advantage of consumers','It depends'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,uid,code=new URLSearchParams(location.search).get('game'),state,players={},bids={},votes={},mine={},host=false,unsubs=[],round=-1,selected=25;
const money=n=>'$'+Number(n).toFixed(0);const btn=(label,fn)=>`<button onclick="${fn}">${label}</button>`;const path=s=>ref(db,`games/${code}/${s}`);const values=o=>Object.values(o||{});function stats(a){let best=0,rev=-1,count=0;for(let p=0;p<=100;p++){let n=a.filter(v=>v>=p).length;if(p*n>rev){best=p;rev=p*n;count=n}}return {best,rev,count,avg:a.length?a.reduce((x,y)=>x+y,0)/a.length:0,n:a.length,personal:a.reduce((x,y)=>x+y,0)}}function arr(r){return values(bids[r]).map(Number)}function chart(a){return Array.from({length:11},(_,i)=>{let n=a.filter(v=>Math.min(10,Math.floor(v/10))===i).length;return `<div>${i*10}${i===10?'':'–'+(i*10+9)} <div class=bar style="width:${a.length?n/a.length*100:0}%"></div>${n}</div>`}).join('')}
function watch(){unsubs.forEach(f=>f());unsubs=[];unsubs.push(onValue(path('state'),s=>{state=s.val();if(!state){app.innerHTML='Game not found.';return}host=state.owner===uid;render();if(host&&!unsubs.host){unsubs.host=true;for(const [k,fn] of [['players',v=>players=v],['bids',v=>bids=v],['votes',v=>votes=v]])unsubs.push(onValue(path(k),s=>{fn(s.val()||{});render()}))}}));unsubs.push(onValue(path('players/'+uid),s=>{mine.player=s.val();render()}));for(let i=0;i<3;i++)unsubs.push(onValue(path(`bids/${i}/${uid}`),s=>{mine[i]=s.val();render()}));unsubs.push(onValue(path('votes/'+uid),s=>{mine.vote=s.val();render()}))}
window.create=async()=>{code=crypto.randomUUID().slice(0,8);await set(path('state'),{owner:uid,phase:'lobby',r:0});history.replaceState(null,'','?game='+code);watch()};window.join=async()=>{let name=document.querySelector('#nick').value.trim();if(name)await set(path('players/'+uid),{name:name.slice(0,30)})};window.go=async(phase,r)=>{let patch={phase,r};if(phase==='bid')patch.deadline=Date.now()+20000;if(phase==='results')patch['results/'+r]=stats(arr(r));if(phase==='final'){patch.summary=[0,1,2].map(i=>stats(arr(i)))}await update(path('state'),patch)};window.submit=async()=>{try{await set(path(`bids/${state.r}/${uid}`),Number(document.querySelector('#bid').value))}catch(e){alert('Bid could not be submitted. The round may have closed.')}};window.vote=async i=>{await set(path('votes/'+uid),i)};window.pick=v=>{selected=Number(v);document.querySelector('#amount').textContent=money(v)};window.exportData=()=>{let rows=['round,bid',...[0,1,2].flatMap(i=>arr(i).map(v=>`${i+1},${v}`))];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='anonymous-bids.csv';a.click()};
function render(){if(!state)return;let {phase,r}=state;if(round!==r){selected=25;round=r}let s=scenarios[r]||scenarios[2];if(host){let url=location.origin+location.pathname+'?game='+code;let a=arr(r),t=stats(a);let html=`<small>HOST • ${code} • ${Object.keys(players).length} players</small>`;if(phase==='lobby')html+=`<div class=panel><h2>Scan to join</h2><img width=220 src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}"><p><a href="${esc(url)}">${esc(url)}</a></p>${values(players).map(p=>esc(p.name)).join(' · ')}</div>`+btn('Start round 1',"go('bid',0)");if(phase==='bid')html+=`<div class=panel><h2>${s[0]}</h2><p>${s[1]}</p><div class=big id=clock></div><p>${a.length} bids received</p></div>`+btn('Close & reveal',`go('results',${r})`);if(phase==='results')html+=`<div class=panel><h2>${s[0]} — results</h2><small>Revenue-maximizing price</small><div class=big>${money(t.best)}</div><p>${t.count} buyers • ${money(t.rev)} revenue • Average ${money(t.avg)} • ${t.n} bids</p>${chart(a)}<details><summary>Demand and revenue by price</summary>${Array.from({length:11},(_,i)=>{let p=i*10,n=a.filter(v=>v>=p).length;return `<p>${money(p)}: ${n} buyers, ${money(p*n)} revenue</p>`}).join('')}</details></div>`+btn(r<2?'Next round':'Compare rounds',r<2?`go('bid',${r+1})`:"go('final',2)");if(['final','twist','poll','end'].includes(phase)){html+=`<div class=grid>${[0,1,2].map(i=>{let t=stats(arr(i));return `<div class=panel>${scenarios[i][0]}<div class=big>${money(t.best)}</div>Average ${money(t.avg)}<p>${t.count} buyers • ${money(t.rev)} revenue</p></div>`}).join('')}</div>`;if(phase==='final')html+=btn('Reveal the twist',"go('twist',2)");if(phase!=='final'){let t=stats(arr(2));html+=`<div class=panel><h2>What if we knew your maximum price?</h2>Uniform price revenue: ${money(t.rev)}<br>Perfect personalized pricing revenue: ${money(t.personal)}</div>`}if(phase==='twist')html+=btn('Launch fairness poll',"go('poll',2)");if(['poll','end'].includes(phase))html+=`<div class=panel><h2>Is personalized pricing fair?</h2>${poll.map((p,i)=>`<p>${p}: ${values(votes).filter(v=>v===i).length}</p>`).join('')}</div>`+btn('Finish',"go('end',2)");if(phase==='end')html+='<h2>You just became the data behind a pricing algorithm.</h2>'+btn('Export anonymous bids','exportData()')}app.innerHTML=html+`<p><a href="${location.pathname}">New session</a></p>`;return}if(!mine.player){app.innerHTML='<div class=panel><h2>Join the game</h2><input id=nick placeholder="Nickname" maxlength=30>'+btn('Join','join()')+'</div>';return}let html=`<small>PLAYER • ${esc(mine.player.name)}</small>`;if(phase==='lobby')html+='<h2>You are in!</h2>Waiting for the host.';if(phase==='bid'){html+=`<div class=panel><small>ROUND ${r+1} / 3 • SAME 15-MINUTE RIDE</small><h2>${s[0]}</h2><p>${s[1]}</p><div id=clock></div>`+(mine[r]!=null?'<h2>Bid locked!</h2>Waiting for results.':`<p>Maximum you would pay?</p><div class=big id=amount>${money(selected)}</div><input id=bid type=range min=0 max=100 value=${selected} oninput="pick(this.value)">${btn('Lock in my bid','submit()')}`)+'</div>'}if(phase==='results'){let t=state.results?.[r];html+=t?`<div class=panel>Market price<div class=big>${money(t.best)}</div>${mine[r]==null?'No bid submitted':mine[r]>=t.best?'You would buy the ride!':'You would decline the ride.'}</div>`:'Waiting for results'}if(phase==='final')html+='<h2>Market comparison</h2>Look at the projector.';if(['twist','poll','end'].includes(phase))html+=`<div class=panel>Your hypothetical personalized price<div class=big>${mine[2]==null?'No bid':money(mine[2])}</div></div>`;if(phase==='poll')html+=mine.vote!=null?'Vote recorded.':`<h2>Is personalized pricing fair?</h2>${poll.map((p,i)=>btn(p,`vote(${i})`)).join('')}`;if(phase==='end')html+='<h2>You just became the data behind a pricing algorithm.</h2>';app.innerHTML=html}
setInterval(()=>{let el=document.querySelector('#clock');if(el&&state?.phase==='bid'){let n=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));el.textContent=n+' seconds';if(!n&&!host){let b=[...app.querySelectorAll('button')].find(b=>b.textContent==='Lock in my bid');if(b)b.disabled=true}}},250);
try{let f=initializeApp(config);db=getDatabase(f);uid=(await signInAnonymously(getAuth(f))).user.uid;if(code)watch();else app.innerHTML='<div class=panel><h2>Ready to run the market?</h2>'+btn('Create game','create()')+'<p><small>Hypothetical bids only. No money is collected. Anonymous responses are used for a classroom pricing demonstration.</small></p></div>'}catch(e){app.innerHTML='<div class=panel>Firebase setup required. See README. <p>'+esc(e.message)+'</p></div>'}
</script></html>
